    <style>

      /* Webkit (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {

      /* Firefox */
      * {

      /* IE/Edge (legacy) */
      * {

      /* Print Styles */
      @media print {
        body * {

        }

          visibility: visible;
        }
        
        .printable-content {
          position: absolute;
          left: 0;
          top: 0;

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
              
              // Force an update check every time the page loads
              registration.update();
              
              // Listen for new versions
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', () => {
                   if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // Tell the new service worker to take over immediately
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                   }
                });
              });
            })
            .catch(error => {
              console.log('ServiceWorker registration failed: ', error);
            });
            
          // Listen for the controlling service worker to change, then reload to get the latest app content
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
